name = "yf-proxy"
main = "worker.js"
compatibility_date = "2024-12-01"

[observability]
enabled = true

# The shared Worker also carries high-volume market-data reads. Keep uncaught
# errors, not an access log for every quote/chart request.
[observability.logs]
invocation_logs = false
head_sampling_rate = 1

[[kv_namespaces]]
binding = "SPEND"
id = "bf70e74407934939bb511990611cb9e7"

# Retained history: the family documents live in this namespace and are kept
# on purpose (see retired_capdoc.js). Never add deleted_classes for it.
[[migrations]]
tag = "v1-cap-doc-coordinator"
new_sqlite_classes = ["CapDocCoordinator"]

[[durable_objects.bindings]]
name = "READER_QUOTA"
class_name = "ReaderQuota"

[[migrations]]
tag = "v2-reader-quota"
new_sqlite_classes = ["ReaderQuota"]
