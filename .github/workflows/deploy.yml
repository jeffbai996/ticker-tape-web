name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # The responsive matrix runs against the bytes that are about to ship,
      # served the way Pages serves them (base path, real origin), and blocks
      # the deploy on a regression. Playwright is installed with pip rather
      # than npm so the browser toolchain never enters the app's dependency
      # tree; setup-python gives an interpreter whose pip is not
      # externally-managed, which the runner's system python is.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe browser
        run: |
          python3 -m pip install --quiet --upgrade playwright
          python3 -m playwright install --with-deps chromium
      - name: Responsive matrix gate
        timeout-minutes: 12
        run: npm run probe -- --json-out probe-matrix.json
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-matrix
          path: probe-matrix.json
          if-no-files-found: warn
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      # Pages throttles rapid-fire deploys: after a burst, the deployment
      # sits "queued" until deploy-pages' timeout kills it — and that timeout
      # is HARD-CAPPED at 10 minutes inside the action (MAX_TIMEOUT clamps
      # any larger input; verified against the pinned source, 2026-08-06 —
      # five stale deploys in a row during a heavy iteration burst). So the
      # ride-out has to be a second attempt, not a longer first one.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Cool off before retrying the throttled deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 180
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
