name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      # Pages throttles rapid-fire deploys: after a burst, the deployment
      # sits "queued" until deploy-pages' timeout kills it — and that timeout
      # is HARD-CAPPED at 10 minutes inside the action (MAX_TIMEOUT clamps
      # any larger input; verified against the pinned source, 2026-08-06 —
      # five stale deploys in a row during a heavy iteration burst). So the
      # ride-out has to be a second attempt, not a longer first one.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Cool off before retrying the throttled deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 180
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
