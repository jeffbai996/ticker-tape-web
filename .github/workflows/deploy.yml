name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages throttles rapid-fire deploys: after ~10 in an hour the
          # deployment sits "queued" past the default 10-minute timeout and
          # the run FAILS even though the build was fine (2026-08-06 — five
          # stale deploys in a row during a heavy iteration burst). 25 min
          # rides out the throttle window; cancel-in-progress above still
          # drops superseded runs.
          timeout: 1500000
